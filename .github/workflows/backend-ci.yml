name: Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/**"
      - "docker-compose.yml"
      - "docker-compose.demo.yml"
      - "docs/**"
      - "README.md"

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q

  container:
    name: Docker build and runtime hardening
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.demo.yml config -q

      - name: Build API image
        run: docker build -t ai-trading-api:ci ./backend

      - name: Verify image does not run as root
        run: |
          uid="$(docker run --rm --entrypoint id ai-trading-api:ci -u)"
          test "$uid" != "0"

services:
  api:
    build: ./backend
    container_name: ai-trading-api
    restart: unless-stopped
    init: true
    ports:
      # Keep the API private by default. Use an SSH tunnel or a separately
      # configured TLS reverse proxy for remote access.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - trading_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  history-sync:
    profiles: ["history-sync"]
    build: ./backend
    container_name: ai-trading-history-sync
    command: ["python", "-m", "app.historical_data_scheduler"]
    restart: unless-stopped
    init: true
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-data/trading.db}
      HISTORICAL_DATA_SYNC_ENABLED: ${HISTORICAL_DATA_SYNC_ENABLED:-false}
      HISTORICAL_DATA_SYNC_TARGETS: ${HISTORICAL_DATA_SYNC_TARGETS:-}
      HISTORICAL_DATA_SYNC_INTERVAL_SECONDS: ${HISTORICAL_DATA_SYNC_INTERVAL_SECONDS:-3600}
      HISTORICAL_DATA_SYNC_LOOKBACK_DAYS: ${HISTORICAL_DATA_SYNC_LOOKBACK_DAYS:-365}
      HISTORICAL_DATA_SYNC_PAGE_LIMIT: ${HISTORICAL_DATA_SYNC_PAGE_LIMIT:-500}
      HISTORICAL_DATA_SYNC_MAX_PAGES_PER_TARGET: ${HISTORICAL_DATA_SYNC_MAX_PAGES_PER_TARGET:-10}
    volumes:
      - trading_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    healthcheck:
      test: ["CMD", "python", "-m", "app.historical_data_scheduler", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    build: ./backend
    container_name: ai-trading-backup
    command: ["python", "-m", "app.backup_scheduler"]
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.backup
        required: false
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-data/trading.db}
      TWELVE_DATA_STATE_PATH: ${TWELVE_DATA_STATE_PATH:-/app/data/twelve_data_state.sqlite3}
      BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-/app/data/backups}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETRY_INTERVAL_SECONDS: ${BACKUP_RETRY_INTERVAL_SECONDS:-300}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - trading_data:/app/data
    networks:
      - backup_egress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    healthcheck:
      test: ["CMD", "python", "-m", "app.backup_healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  trading_data:

networks:
  backup_egress:
    driver: bridge

services:
  api:
    build: ./backend
    container_name: ai-trading-paper-demo
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.demo
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_PATH: /app/data/trading.db
      INITIAL_CASH_EUR: "10000"
      PAPER_DEMO_MODE: "true"
      PAPER_EXPERIMENTAL_STRATEGIES_ENABLED: "true"
      MAX_ORDER_FRACTION: "0.05"
      MAX_STOP_DISTANCE_FRACTION: "0.03"
      RISK_PER_TRADE_FRACTION: "0.0025"
      EXCHANGE_ID: kraken
      MARKET_DATA_PROVIDER_IDS: kraken
      BINANCE_READONLY_API_KEY: ""
      BINANCE_READONLY_API_SECRET: ""
      CCXT_READONLY_API_KEY: ""
      CCXT_READONLY_API_SECRET: ""
      BINANCE_SPOT_DEMO_ENABLED: "false"
      BINANCE_SPOT_DEMO_API_KEY: ""
      BINANCE_SPOT_DEMO_API_SECRET: ""
      BACKUP_EXTERNAL_ENABLED: "false"
      AGENT_CONTROL_TOKEN: local-paper-demo-only
    volumes:
      - paper_demo_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

volumes:
  paper_demo_data:

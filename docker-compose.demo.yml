services:
  api:
    build: ./backend
    container_name: ai-trading-paper-demo
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    # Compose interpolates these values from the project-root .env file.
    # Only explicitly listed variables are passed to this container; do not
    # inject the complete .env because it may contain unrelated credentials.
    environment:
      DATABASE_PATH: /app/data/trading.db
      INITIAL_CASH_EUR: ${DEMO_INITIAL_CASH_EUR:-10000}
      PAPER_DEMO_MODE: "true"
      PAPER_EXPERIMENTAL_STRATEGIES_ENABLED: ${PAPER_EXPERIMENTAL_STRATEGIES_ENABLED:-true}
      MAX_ORDER_FRACTION: ${DEMO_MAX_ORDER_FRACTION:-0.05}
      MAX_STOP_DISTANCE_FRACTION: ${DEMO_MAX_STOP_DISTANCE_FRACTION:-0.03}
      RISK_PER_TRADE_FRACTION: ${DEMO_RISK_PER_TRADE_FRACTION:-0.0025}
      EXCHANGE_ID: ${EXCHANGE_ID:-kraken}
      MARKET_DATA_PROVIDER_IDS: ${MARKET_DATA_PROVIDER_IDS:-kraken}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      TWELVE_DATA_DAILY_CREDIT_BUDGET: ${TWELVE_DATA_DAILY_CREDIT_BUDGET:-750}
      TWELVE_DATA_MIN_REQUEST_INTERVAL_SECONDS: ${TWELVE_DATA_MIN_REQUEST_INTERVAL_SECONDS:-7.5}
      BINANCE_READONLY_API_KEY: ${BINANCE_READONLY_API_KEY:-}
      BINANCE_READONLY_API_SECRET: ${BINANCE_READONLY_API_SECRET:-}
      CCXT_READONLY_EXCHANGE_ID: ${CCXT_READONLY_EXCHANGE_ID:-kraken}
      CCXT_READONLY_ACCOUNT_ALIAS: ${CCXT_READONLY_ACCOUNT_ALIAS:-}
      CCXT_READONLY_API_KEY: ${CCXT_READONLY_API_KEY:-}
      CCXT_READONLY_API_SECRET: ${CCXT_READONLY_API_SECRET:-}
      ALPACA_PAPER_ENABLED: ${ALPACA_PAPER_ENABLED:-false}
      ALPACA_PAPER_API_KEY: ${ALPACA_PAPER_API_KEY:-}
      ALPACA_PAPER_API_SECRET: ${ALPACA_PAPER_API_SECRET:-}
      ALPACA_PAPER_ACCOUNT_ALIAS: ${ALPACA_PAPER_ACCOUNT_ALIAS:-alpaca-paper-readonly}
      ALPACA_PAPER_EXPECTED_ACCOUNT_ID: ${ALPACA_PAPER_EXPECTED_ACCOUNT_ID:-}
      BINANCE_SPOT_DEMO_ENABLED: ${BINANCE_SPOT_DEMO_ENABLED:-false}
      BINANCE_SPOT_DEMO_API_KEY: ${BINANCE_SPOT_DEMO_API_KEY:-}
      BINANCE_SPOT_DEMO_API_SECRET: ${BINANCE_SPOT_DEMO_API_SECRET:-}
      BINANCE_SPOT_DEMO_MAX_ORDER_QUOTE: ${BINANCE_SPOT_DEMO_MAX_ORDER_QUOTE:-25}
      BINANCE_DEMO_RECONCILIATION_INTERVAL_SECONDS: ${BINANCE_DEMO_RECONCILIATION_INTERVAL_SECONDS:-30}
      AGENT_CONTROL_TOKEN: ${AGENT_CONTROL_TOKEN:-local-paper-demo-only}
      DECISION_CYCLE_INTERVAL_SECONDS: ${DECISION_CYCLE_INTERVAL_SECONDS:-300}
      EQUITY_RESEARCH_INTERVAL_SECONDS: ${EQUITY_RESEARCH_INTERVAL_SECONDS:-21600}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETRY_INTERVAL_SECONDS: ${BACKUP_RETRY_INTERVAL_SECONDS:-300}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_DIRECTORY: /app/data/backups
      BACKUP_EXTERNAL_ENABLED: "false"
    volumes:
      - paper_demo_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  paper_demo_data:
